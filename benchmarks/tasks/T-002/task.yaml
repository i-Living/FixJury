  body: |-
    See #1438.

    Reproducible example:

    ```python
    from datetime import datetime
    import sys

    from loguru import logger
    import freezegun

    logger.remove()
    logger.add(sys.stderr, format="{time:x}")

    dt = datetime(2026, 2, 22, 00, 24, 12, 1)

    with freezegun.freeze_time(dt):
        logger.info("Test")
    ```

    Expected output: `1771716252000001`

    Actual output: `1771716252000002`
