  body: "Hi! I'm running `isort` 8.0.1 with Python 3.10.20. It appears that the [sort re-exports (`__all__`)](https://isort.readthedocs.io/en/latest/configuration/options.html#sort-re-exports)\
    \ configuration does not recognize the `# isort: skip` action comment:\n\n```python\n# reproduction.py\n\
    \nmy_list = [\"bee\", \"Albatross\", \"Dinosaur\", \"cat\"]\n__all__ = my_list # isort: skip\n```\n\
    \n```bash\n$ isort --sort-reexports reproduction.py \nERROR: isort failed to parse the given literal\
    \ __all__ = my_list # isort: skip\n. It's important to note that isort literal sorting only supports\
    \ simple literals parsable by ast.literal_eval which gave the exception of malformed node or string\
    \ on line 1: <ast.Name object at 0x107927640>.\n```\n\nI expected `isort` to skip over the `__all__`\
    \ line and not give an error. I was able to work around the issue using `# isort: off`, but I would\
    \ prefer to use `# isort: skip` if possible:\n\n```python\n# workaround.py\n\nmy_list = [\"bee\",\
    \ \"Albatross\", \"Dinosaur\", \"cat\"]\n# isort: off\n__all__ = my_list\n# isort: on\n```"
title: '`sort_reexports` does not respect `isort: skip`'
