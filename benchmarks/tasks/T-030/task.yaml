  body: "Using a `click.progressbar` with:\n- `update_min_steps` which isn't a divisor of `length`\n-\
    \ `show_pos=True`\n\nwon't show full completion at the end. This can be reproduced as follows:\n\n\
    ```python\nimport time\n\nimport click\n\nwith click.progressbar(\n    range(20),\n    show_pos=True,\n\
    \    update_min_steps=7,\n) as bar:\n    for i in bar:\n        time.sleep(0.1)\n```\n\nwith (final)\
    \ output in the terminal\n\n```text\n  [####################################]  14/20          \n```\n\
    \n**Expected behaviour**: I had expected the output to show `20/20` at the end.\nThis would be consistent\
    \ with the default percentage formatting, as can be seen by commenting the line `show_pos=True` and\
    \ re-running the reproduction:\n\n```text\n  [####################################]  100%        \
    \  \n```\n\nEnvironment:\n\n- Python version: tested with 3.12.3 and 3.14.3\n- Click version: 8.4.1\n"
