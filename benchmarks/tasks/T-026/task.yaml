  body: "Does it make sense to make `fields.Number` abstract?\n\nThe reason I ask is because I just had\
    \ to do an upgrade from 2.15.4 to 4.2.2 and most of the errors were very quick to work through because\
    \ the error information was very accurate to the problem (thank you for that).\n\nBut I had two fields\
    \ on a custom `Schema` that were `fields.Number`. The error message that came back was `AttributeError:\
    \ 'Number' object has no attribute 'num_type'.` It happens in the `_format_num` function since `num_type`\
    \ is set on the subclasses (like `IntegerField`) but not on the `Number` base class.\n\nSince this\
    \ is a class that isn't meant to be used, would it be better to make it not instantiate-able? It could\
    \ be an `abc.ABC` with a very simple `@abstractmethod` on the `__init__` method or you could raise\
    \ an error in `__new__`, or however else one typically does this.\n\nThen, for example, I could have\
    \ seen `Can't instantiate abstract class B...` or something of the like. I would then know that the\
    \ class is meant to be abstract without having to rely on the docstring.\n\nThis is obviously not\
    \ a big deal, but I typically don't like relying on docstrings to decide implementation. Though I\
    \ prefer the docstring over having to read the entire implementation and assuming the intent.\n\n\
    ## Example\n\nOn a Django model:\n\n```python\nfrom django.db import models\n\nfrom marshmallow import\
    \ EXCLUDE, Schema, fields, validate\n\nclass TimeframeSchema(Schema):\n    type = fields.Str(required=True)\n\
    \    duration = fields.Number(required=True, validate=validate.Range(min=0))\n\n    class Meta:\n\
    \        unknown = EXCLUDE\n\ndef validate_timeframe(timeframe):\n    TimeframeSchema().load(timeframe)\n\
    \nclass AModel(models.Model):\n    timeframe = models.JSONField(validators=[validate_timeframe])\n\
    \n    def save(self, *args, **kwargs):\n        self.full_clean()\n        super().save(*args, **kwargs)\n\
    ```\n\nThen in a test file:\n\n```python\nfrom model_bakery import baker\nfrom app.models import AModel\n\
    \n@python.mark.django_db\ndef test__some_test:\n    a_model = baker.make(AModel, timeframe={\"type\"\
    : \"annual\", \"duration\": 12})\n    assert a_model\n```\n\nThen running `pytest my_test_file`:\n\
    \n```\ntests/apps/app/models/my_test_file.py:6: \n_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\
    \ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\
    \ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\
    \ \n/opt/venv/lib/python3.10/site-packages/model_bakery/baker.py:133: in make\n    return baker.make(\n\
    /opt/venv/lib/python3.10/site-packages/model_bakery/baker.py:389: in make\n    return self._make(**params)\n\
    /opt/venv/lib/python3.10/site-packages/model_bakery/baker.py:470: in _make\n    instance = self.instance(\n\
    /opt/venv/lib/python3.10/site-packages/model_bakery/baker.py:504: in instance\n    instance.save(**_save_kwargs)\n\
    the_app/apps/app/models/a_model.py:18: in save\n    self.full_clean()\n/opt/venv/lib/python3.10/site-packages/django/db/models/base.py:1470:\
    \ in full_clean\n    self.clean_fields(exclude=exclude)\n/opt/venv/lib/python3.10/site-packages/django/db/models/base.py:1522:\
    \ in clean_fields\n    setattr(self, f.attname, f.clean(raw_value, self))\n/opt/venv/lib/python3.10/site-packages/django/db/models/fields/__init__.py:778:\
    \ in clean\n    self.run_validators(value)\n/opt/venv/lib/python3.10/site-packages/django/db/models/fields/__init__.py:730:\
    \ in run_validators\n    v(value)\nthe_app/apps/app/models/a_model.py:13: in validate_timeframe\n\
    \    TimeframeSchema().load(timeframe)\n/opt/venv/lib/python3.10/site-packages/marshmallow/schema.py:730:\
    \ in load\n    return self._do_load(\n/opt/venv/lib/python3.10/site-packages/marshmallow/schema.py:887:\
    \ in _do_load\n    result = self._deserialize(\n/opt/venv/lib/python3.10/site-packages/marshmallow/schema.py:676:\
    \ in _deserialize\n    value = self._call_and_store(\n/opt/venv/lib/python3.10/site-packages/marshmallow/schema.py:517:\
    \ in _call_and_store\n    value = getter_func(data)\n/opt/venv/lib/python3.10/site-packages/marshmallow/schema.py:669:\
    \ in getter\n    return field_obj.deserialize(\n/opt/venv/lib/python3.10/site-packages/marshmallow/fields.py:374:\
    \ in deserialize\n    output = self._deserialize(value, attr, data, **kwargs)\n/opt/venv/lib/python3.10/site-packages/marshmallow/fields.py:960:\
    \ in _deserialize\n    return self._validated(value)\n/opt/venv/lib/python3.10/site-packages/marshmallow/fields.py:943:\
    \ in _validated\n    return self._format_num(value)\n_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\
    \ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\
    \ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\
    \ _ \n\nself = <fields.Number(dump_default=<marshmallow.missing>, attribute=None, validate=<Range(min=0,\
    \ max=None, min_inclusive=True... be null.', 'validator_failed': 'Invalid value.', 'invalid': 'Not\
    \ a valid number.', 'too_large': 'Number too large.'})>\nvalue = 12\n\n    def _format_num(self, value)\
    \ -> _NumT:\n        \"\"\"Return the number value for value, given this field's `num_type`.\"\"\"\
    \n>       return self.num_type(value)  # type: ignore[call-arg]\nE       AttributeError: 'Number'\
    \ object has no attribute 'num_type'\n\n/opt/venv/lib/python3.10/site-packages/marshmallow/fields.py:935:\
    \ AttributeError\n```\n"
