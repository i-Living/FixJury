  body: "**Proposal and rationale:**\n\nThe `serialize` tool wraps a single iterator instance and is used\
    \ inline with instance creation: `serialize(itertools.count(100, 5))`.\n\nIf every instance needs\
    \ to be serialized, it is more convenient to wrap the function that creates the iterator: `atomic_counter\
    \ = synchonized(itertools.count)`.  Later, serialized instances can be created directly: `atomic_counter(100,\
    \ 5)`.\n\nThe wrapper can also be used as a decorator around a generator definition.\n\n**Draft implmentation:**\n\
    \n```python\ndef synchronized(func):\n    \"\"\"Wrap an function that produces iterators to serialized\
    \ all instances.\n\n    Existing itertools and more-itertools can be wrapped so that their\n    instances\
    \ are serialized.\n\n    For example, ``itertools.count`` does not make thread-safe instances\n  \
    \  but that is easily fixed with::\n\n        atomic_counter = synchronized(itertools.count)\n\n \
    \   Can also be used as a decorator for generator functions definitions\n    so that the generator\
    \ instances are serialized::\n\n        @synchronized\n        def enumerate_and_timestamp(iterable):\n\
    \            for count, value in enumerate(iterable):\n                yield count, time_ns(), value\
    \                \n\n    \"\"\"\n    @functools.wraps(func)\n    def inner(*args, **kwargs):\n   \
    \     iterator = func(*args, **kwargs)\n        return serialize(iterator)\n    return inner\n```\n\
    \n**Notes:**\n\nThe name \"synchronized\" came from Java."
