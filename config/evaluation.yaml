# Evaluation profiles (PLAN_V1.1 §1.3).
#
# A weight change is a version change: the version is stored with every result, so two
# scores with different versions are never silently compared. The default weights are the
# ones SPEC_V1.1 §5 fixes; changing them here changes what every new evaluation means.

profiles:
  default:
    version: "1"
    weights:
      correctness: 30
      regression_safety: 20
      code_quality: 15
      maintainability: 10
      security: 10
      minimality: 5
      requirement_compliance: 10
