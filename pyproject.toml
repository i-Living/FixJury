[project]
name = "fixjury"
version = "0.1.0"
description = "Agent-agnostic reliability layer for autonomous code repair"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "docker>=7.1",
    "redis>=5.2",
    "typer>=0.15",
    "httpx>=0.28",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "opentelemetry-sdk>=1.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
fixjury = "fixjury.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixjury"]
