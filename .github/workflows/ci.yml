name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run fixjury tasks validate benchmarks

  # The metrics page is a separate build with its own toolchain, and it is
  # prerendered from the export `fixjury dashboard` writes. CI builds it from a
  # fixture, so a broken page or a broken Python-to-TypeScript contract fails here
  # instead of at deploy time, without Postgres or snapshots.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv python install 3.12
      - run: uv sync --frozen

      - name: Install the page dependencies
        run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - name: Write the fixture export the page is built from
        run: uv run python scripts/dashboard_fixture.py /tmp/snapshots.json

      - name: Build the static export
        run: npm run build
        working-directory: web
        env:
          DASHBOARD_DATA: /tmp/snapshots.json
