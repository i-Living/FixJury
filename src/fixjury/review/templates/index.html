<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FixJury — review</title>
  <style>
    body { font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f6f6f4; color: #1d1d1b; }
    main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1.25rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: .6rem .75rem; border-bottom: 1px solid #e6e6e2; }
    th { font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #6b6b66; }
    a { color: #1a5fb4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { color: #6b6b66; }
    .empty { padding: 1rem; background: #fff; border: 1px solid #e6e6e2; }
  </style>
</head>
<body>
<main>
  <h1>Blind review — batches</h1>
  {% if batches %}
  <table>
    <thead>
      <tr><th>Batch</th><th>Task</th><th>Pass</th><th>Progress</th><th></th></tr>
    </thead>
    <tbody>
      {% for batch in batches %}
      <tr>
        <td><code>{{ batch.id }}</code></td>
        <td>{{ batch.task_id }}</td>
        <td>{{ batch.pass_no }}</td>
        <td>{{ batch.done }} / {{ batch.total }}</td>
        <td><a href="/batch/{{ batch.id }}">open</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="empty">No batches yet. Pack some with <code>fixjury review pack</code>.</p>
  {% endif %}
</main>
</body>
</html>
